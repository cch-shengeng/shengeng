# 每天自動讀取醫院部門網頁的「計畫成果分享」「工作討論議錄」，更新 cms.json
name: 同步醫院網頁成果與議錄

on:
  schedule:
    - cron: '23 23 * * *'   # 每天台灣時間 07:23
    - cron: '53 4 * * *'    # 每天台灣時間 12:53
  workflow_dispatch:         # 可在 Actions 頁面手動按「Run workflow」立即同步

permissions:
  contents: write

concurrency:
  group: sync-cms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 讀取醫院網頁
        run: python scripts/sync_cms.py

      - name: 有變動才存檔
        run: |
          if [ -z "$(git status --porcelain -- cms.json)" ]; then
            echo "沒有新文章"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms.json
          git commit -m "自動同步醫院網頁成果與議錄"
          git push
